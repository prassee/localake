services:
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000" # S3 API
      - "9003:9001" # Console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    networks:
      - localake_net

  nessie:
    image: projectnessie/nessie:latest
    ports:
      - "19120:19120"
    depends_on:
      - minio
      - postgres
    environment:
      # Quarkus HTTP port inside the container (Nessie's default is 19120)
      QUARKUS_HTTP_PORT: 19120

      # --- Version store: use JDBC with Postgres ---
      NESSIE_VERSION_STORE_TYPE: jdbc
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessiepass
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: nessiepass

      # --- S3 (MinIO) settings for object storage ---
      # Container-internal MinIO endpoint (service:container): use the
      # MinIO container port 9000. Compose maps the host ports 9002:9000
      # and 9003:9001 so host clients reach MinIO at host.docker.internal:9002.
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000    
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_EXTERNAL_ENDPOINT: http://host.docker.internal:9002
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      # Default region for S3 (used by Iceberg/Nessie). Set to any value for MinIO.
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      # Use AWSSDK default credentials provider so we can pass AWS_* env vars
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: APPLICATION_GLOBAL
      AWS_ACCESS_KEY_ID: "minio"
      AWS_SECRET_ACCESS_KEY: "minio123"

      # Default warehouse name used by clients when none is provided
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
      # Define the default warehouse storage location (must exist conceptually)
      NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: s3://warehouse/
    volumes:
      - nessie-data:/var/lib/nessie
    networks:
      - localake_net

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessiepass
      POSTGRES_DB: nessie
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - localake_net

  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    platform: linux/amd64
    environment:
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "7077:7077" # Spark master RPC
      - "8080:8080" # Spark master web UI
    volumes:
      - ./etl/src:/opt/etl/src
      - ./etl/lib:/opt/etl/lib
    networks:
      - localake_net
    # command: ["/opt/spark/sbin/start-master.sh"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    image: apache/spark:3.5.6
    platform: linux/amd64
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./etl/src:/opt/etl/src
      - ./etl/lib:/opt/etl/lib
    networks:
      - localake_net
    # command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077


  spark-worker-2:
    image: apache/spark:3.5.6
    platform: linux/amd64
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    volumes:
      - ./etl/src:/opt/etl/src
      - ./etl/lib:/opt/etl/lib
    networks:
      - localake_net
    # command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077


  trino:
    image: trinodb/trino:481
    ports:
      - "8088:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - localake_net

volumes:
  minio-data:
  nessie-data:
  postgres-data:

networks:
  localake_net:
    driver: bridge