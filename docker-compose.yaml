services:
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000" # S3 API
      - "9003:9001" # Console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    networks:
      - localake_net

  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.1
    ports:
      - "19120:19120"
    depends_on:
      - minio
      - postgres
    environment:
      # Quarkus HTTP port inside the container (Nessie's default is 19120)
      QUARKUS_HTTP_PORT: 19120
      NESSIE_CATALOG_SERVICE_ENABLED: "true"

      # --- Version store: use JDBC with Postgres ---
      NESSIE_VERSION_STORE_TYPE: JDBC
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie_catalog
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie_catalog
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessiepass
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: nessiepass

      # --- S3 (MinIO) settings for object storage ---
      # Container-internal MinIO endpoint (service:container): use the
      # MinIO container port 9000. Compose maps the host ports 9002:9000
      # and 9003:9001 so host clients reach MinIO at host.docker.internal:9002.
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_EXTERNAL_ENDPOINT: http://host.docker.internal:9002
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      # Default region for S3 (used by Iceberg/Nessie). Set to any value for MinIO.
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      # Use AWSSDK default credentials provider so we can pass AWS_* env vars
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: APPLICATION_GLOBAL
      AWS_ACCESS_KEY_ID: "minio"
      AWS_SECRET_ACCESS_KEY: "minio123"

      # Default warehouse name used by clients when none is provided
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
      # Define the default warehouse storage location (must exist conceptually)
      NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: s3://warehouse/
    volumes:
      - nessie-data:/var/lib/nessie
    networks:
      - localake_net

  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessiepass
      POSTGRES_DB: nessie
      POSTGRES_INITDB_ARGS: "-E UTF8"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_worker_processes=10"
      - "-c"
      - "shared_preload_libraries=pgoutput"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/scripts:/usr/local/bin/postgres-scripts
    ports:
      - "5432:5432"
    networks:
      - localake_net

  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    platform: linux/amd64
    environment:
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "7077:7077" # Spark master RPC
      - "8080:8080" # Spark master web UI
    volumes:
      - ./etl/src:/opt/etl/src
      - ./etl/lib:/opt/etl/lib
    networks:
      - localake_net
    # command: ["/opt/spark/sbin/start-master.sh"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    image: apache/spark:3.5.6
    platform: linux/amd64
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./etl/src:/opt/etl/src
      - ./etl/lib:/opt/etl/lib
    networks:
      - localake_net
    # command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  spark-worker-2:
    image: apache/spark:3.5.6
    platform: linux/amd64
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    volumes:
      - ./etl/src:/opt/etl/src
      - ./etl/lib:/opt/etl/lib
    networks:
      - localake_net
    # command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  trino:
    image: trinodb/trino:481
    ports:
      - "8088:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - localake_net

  olake-ui:
    image: olakego/ui:latest
    pull_policy: always
    container_name: olake-ui
    environment:
      USERNAME: admin
      PASSWORD: password
      OLAKE_SECRET_KEY: ""
      PERSISTENT_DIR: /tmp/olake-config
      ENABLE_OPTIMIZATION: "false"
      MAX_MEMORY: 67108864
      MAX_UPLOAD_SIZE: 67108864
      HTTP_READ_HEADER_TIMEOUT: 10s
      HTTP_READ_TIMEOUT: 600s
      HTTP_WRITE_TIMEOUT: 600s
      HTTP_IDLE_TIMEOUT: 600s
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_USER: temporal
      DB_PASSWORD: temporal
      DB_SSLMODE: disable
      OLAKE_DB_NAME: postgres
      TEMPORAL_DB_NAME: temporal
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /private/tmp/olake-config:/tmp/olake-config
    networks:
      - localake_net
    depends_on:
      postgresql:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8000" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  signup-init:
    image: curlimages/curl:latest
    container_name: olake-signup-init
    environment:
      USERNAME: admin
      PASSWORD: password
      EMAIL: admin@example.com
      OLAKE_APP_URL: http://olake-ui:8000/signup
    networks:
      - localake_net
    depends_on:
      olake-ui:
        condition: service_healthy
    command: >
      sh -c '
        echo "signup-init: creating Olake admin user";
        HTTP_RESPONSE_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "{\"username\":\"$$USERNAME\",\"password\":\"$$PASSWORD\",\"email\":\"$$EMAIL\"}" "$$OLAKE_APP_URL");
        if [ "$${HTTP_RESPONSE_CODE}" -ge 200 ] && [ "$${HTTP_RESPONSE_CODE}" -lt 300 ]; then
          echo "signup-init: user created successfully";
        elif [ "$${HTTP_RESPONSE_CODE}" -eq 409 ] || [ "$${HTTP_RESPONSE_CODE}" -eq 400 ]; then
          echo "signup-init: user already exists, continuing";
        else
          echo "signup-init: user creation failed with HTTP $${HTTP_RESPONSE_CODE}";
          exit 1;
        fi
      '
    restart: "no"

  olake-worker:
    image: olakego/ui-worker:latest
    pull_policy: always
    container_name: olake-worker
    environment:
      OLAKE_SECRET_KEY: ""
      PERSISTENT_DIR: /tmp/olake-config
      OLAKE_CALLBACK_URL: http://olake-ui:8000/internal/worker/callback
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_USER: temporal
      DB_PASSWORD: temporal
      DB_SSLMODE: disable
      OLAKE_DB_NAME: postgres
      TEMPORAL_DB_NAME: temporal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /private/tmp/olake-config:/tmp/olake-config
    networks:
      - localake_net
    depends_on:
      temporal:
        condition: service_started
      olake-ui:
        condition: service_healthy
      signup-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgresql:
    image: postgres:13
    container_name: olake-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - olake-postgres-data:/var/lib/postgresql/data
    networks:
      - localake_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U temporal -h localhost -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.22.3
    container_name: temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    networks:
      - localake_net
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.16.2
    container_name: temporal-ui
    profiles:
      - debug
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8089:8080"
    networks:
      - localake_net
    restart: unless-stopped

  upi-transactions-writer:
    build:
      context: .
      dockerfile: etl/Dockerfile.upi-mutations
    environment:
      UPI_PG_HOST: postgres
      UPI_PG_PORT: 5432
      UPI_PG_DB: nessie
      UPI_PG_USER: nessie
      UPI_PG_PASSWORD: nessiepass
    depends_on:
      - postgres
    networks:
      - localake_net
    restart: unless-stopped

volumes:
  minio-data:
  nessie-data:
  postgres-data:
  olake-data:
  olake-postgres-data:

networks:
  localake_net:
    driver: bridge
